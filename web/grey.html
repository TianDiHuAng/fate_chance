<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>《一世》· 灰底原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23222%27/%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#1a1a1a; --ink2:#555; --ink3:#888; --line:#d8d8d8;
    --bg:#f4f4f2; --card:#fff;
    --a:#0b6e4f;   /* 本命 */
    --b:#a33a1f;   /* 之卦 */
    --warn:#b45309;
    --dead:#9a9a9a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px;line-height:1.6}
  body{padding:12px 12px 40px;max-width:560px;margin:0 auto}
  h1{font-size:17px;margin:0 0 2px;font-weight:600;letter-spacing:.02em}
  .sub{font-size:11px;color:var(--ink3);margin:0 0 16px}
  .bar{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink2);
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap}
  .bar b{color:var(--ink);font-weight:600}
  .life{display:flex;gap:3px}
  .life i{width:13px;height:13px;border:1px solid #999;border-radius:2px;display:block}
  .life i.on{background:#333}
  .life i.crit{background:#c0392b;border-color:#c0392b}

  .screen{display:none}
  .screen.on{display:block}

  .box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
  .box-t{font-size:11px;color:var(--ink3);letter-spacing:.08em;margin-bottom:10px}

  button{font:inherit;cursor:pointer}
  .btn{width:100%;padding:14px;border:1px solid #333;background:#333;color:#fff;border-radius:6px;
    font-size:15px;letter-spacing:.05em}
  .btn:disabled{background:#bbb;border-color:#bbb;cursor:not-allowed}
  .btn2{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:13px}

  /* 摇卦 */
  .shake{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0}
  .coin{width:56px;height:56px;border-radius:50%;border:2px solid #666;background:#fff;
    display:grid;place-items:center;font-size:19px;color:#333;transition:transform .1s}
  .coins{display:flex;gap:10px}
  .hold{position:relative;width:150px;height:150px;border-radius:50%;border:2px dashed #999;
    display:grid;place-items:center;font-size:13px;color:var(--ink2);user-select:none}
  .hold .ring{position:absolute;inset:-2px;border-radius:50%;
    background:conic-gradient(#333 var(--p,0%),transparent 0);opacity:.16}
  .hold.press{border-style:solid}

  .yao{display:flex;gap:5px;justify-content:center;margin:10px 0}
  .yao span{width:40px;height:9px;background:#333;border-radius:1px}
  .yao span.yin{background:none;border-top:9px solid #333;height:0;position:relative}
  .yao span.yin::after{content:"";position:absolute;left:15px;top:0;width:10px;height:9px;background:#fff}

  /* 卦名 */
  .hexname{text-align:center;margin:6px 0 2px}
  .hexname .g{font-size:44px;line-height:1}
  .hexname .n{font-size:21px;font-weight:600;margin-top:4px}
  .hexname .j{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.7}

  /* 三片证据 */
  .ev{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;
    padding:10px 0;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:none}
  .ev .k{font-size:11px;color:var(--ink3);padding-top:2px;letter-spacing:.06em}
  .ev .v{font-size:14px}
  .ev .v b{font-weight:600}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid currentColor;
    border-radius:3px;margin-left:4px;vertical-align:1px}
  .t-a{color:var(--a)} .t-b{color:var(--b)}
  .t-w{color:var(--a)} .t-p{color:var(--ink2)} .t-d{color:var(--dead)}
  .t-i{color:var(--warn)}

  /* 两张卡 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff;
    text-align:left;transition:.15s;display:flex;flex-direction:column;gap:5px}
  .card:hover{border-color:#999}
  .card.on{border-color:#333;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
  .card .cn{font-size:15px;font-weight:600}
  .card .ce{font-size:12px;color:var(--ink2)}
  .card .cs{font-size:12px;color:var(--ink2);margin-top:2px}
  .card .cp{font-size:11px;color:var(--ink3);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}

  .stake{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stake button{padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:6px;
    display:flex;flex-direction:column;gap:3px;align-items:center}
  .stake button.on{border-color:#333;background:#333;color:#fff}
  .stake .n{font-size:14px;font-weight:600}
  .stake .d{font-size:11px;opacity:.75}

  .hint{font-size:12px;color:var(--ink2);background:#fafafa;border-left:3px solid var(--line);
    padding:8px 10px;margin-top:10px;line-height:1.7}
  .hint.warn{border-left-color:var(--warn);color:var(--warn)}

  /* 揭晓 */
  .reveal{text-align:center;padding:8px 0}
  .reveal .big{font-size:26px;font-weight:700;margin:8px 0}
  .reveal .why{font-size:13px;color:var(--ink2);line-height:1.8;text-align:left;
    background:#fafafa;border-radius:6px;padding:12px;margin-top:12px}
  .ok{color:var(--a)} .no{color:#c0392b}

  .log{margin-top:14px;font-size:12px;color:var(--ink2)}
  .log div{padding:5px 0;border-top:1px dashed var(--line)}
  .log b{color:var(--ink)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
  .stat .k{font-size:11px;color:var(--ink3)}
  .stat .v{font-size:19px;font-weight:600;margin-top:2px}

  .pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .pick2 button{padding:16px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;
    display:flex;flex-direction:column;gap:4px;align-items:center}
  .pick2 button.on{border-color:#333;background:#333;color:#fff}
  .pick2 .g{font-size:30px}
  .pick2 .n{font-size:14px;font-weight:600}
  .pick2 .e{font-size:11px;opacity:.7}
</style>
</head>
<body>

<div class="bar" id="bar" style="display:none">
  <span>命 <span class="life" id="life"></span> <b id="lifeNum" data-life="12">12</b></span>
  <span>财 <b id="cash">0</b></span>
  <span>名 <b id="fame">0</b></span>
  <span>缘 <b id="bond">0</b></span>
  <span style="margin-left:auto" id="secLabel"></span>
</div>

<!-- 出生 -->
<section class="screen on" id="s-birth">
  <h1>一世</h1>
  <p class="sub">灰底原型 · 只验一件事：三片证据，人能不能读懂</p>

  <div class="box">
    <div class="box-t">一 · 摇第一组（定你的下卦）</div>
    <div class="shake">
      <div class="coins"><div class="coin">背</div><div class="coin">背</div><div class="coin">背</div></div>
      <div class="hold" id="hold1"><div class="ring"></div><span>长按 0.8 秒摇卦</span></div>
      <div class="yao" id="yao1"></div>
    </div>
  </div>

  <div class="box" id="box2" style="display:none">
    <div class="box-t">二 · 摇第二组</div>
    <div class="shake">
      <div class="hold" id="hold2"><div class="ring"></div><span>长按 0.8 秒摇卦</span></div>
      <div class="yao" id="yao2"></div>
    </div>
  </div>

  <div class="box" id="boxPick" style="display:none">
    <div class="box-t">三 · 择一个本命（这一辈子押的那条路）</div>
    <div class="pick2" id="pickWrap"></div>
    <p class="hint">本命五行决定你一生的行当。另一组就是「之卦」——每年天时不利时会转到它。</p>
  </div>

  <button class="btn" id="btnStart" style="display:none" disabled>开始这一世</button>
</section>

<!-- 一节 -->
<section class="screen" id="s-run">
  <!-- 摇卦 -->
  <div class="box" id="p-shake">
    <div class="box-t" id="shakeTitle">今年天时 · 长按摇上卦</div>
    <div class="shake">
      <div class="hold" id="hold3"><div class="ring"></div><span>长按 0.8 秒</span></div>
      <div class="yao" id="yao3"></div>
    </div>
  </div>

  <!-- 卦名 -->
  <div class="box" id="p-hex" style="display:none">
    <div class="hexname">
      <div class="g" id="hexGlyph">䷀</div>
      <div class="n" id="hexName">乾</div>
      <div class="j" id="hexJudge"></div>
    </div>
  </div>

  <!-- 证据 -->
  <div class="box" id="p-ev" style="display:none">
    <div class="box-t">三片证据 · 自己合</div>
    <div class="ev"><div class="k">卦指</div><div class="v" id="evGua"></div></div>
    <div class="ev"><div class="k">月令</div><div class="v" id="evMonth"></div></div>
    <div class="ev"><div class="k">牌</div><div class="v" id="evCard"></div></div>
  </div>

  <!-- 断 + 注 -->
  <div class="box" id="p-pick" style="display:none">
    <div class="box-t">断 · 今年谁得势？</div>
    <div class="cards" id="cardsWrap"></div>
    <div class="stake">
      <button data-stake="light"><span class="n">轻</span><span class="d">命 −0</span></button>
      <button data-stake="mid"><span class="n">中</span><span class="d">命 −1</span></button>
      <button data-stake="heavy"><span class="n">重</span><span class="d">命 −2</span></button>
    </div>
    <p class="hint" id="pickHint">先选一张，再选注码。</p>
    <button class="btn" id="btnGo" disabled style="margin-top:12px">落定</button>
  </div>

  <!-- 揭晓 -->
  <div class="box" id="p-reveal" style="display:none">
    <div class="reveal">
      <div class="sub" style="margin:0">得势</div>
      <div class="big" id="rvWho">—</div>
      <div id="rvResult"></div>
      <div class="why" id="rvWhy"></div>
    </div>
    <button class="btn" id="btnNext" style="margin-top:14px">下一节</button>
  </div>

  <div class="log" id="log"></div>
</section>

<!-- 结算 -->
<section class="screen" id="s-end">
  <div class="box">
    <div class="box-t">收摊</div>
    <div class="hexname"><div class="n" id="endName">—</div></div>
    <p style="text-align:center;color:var(--ink2);font-size:13px" id="endText"></p>
  </div>
  <div class="grid2" style="margin-bottom:12px">
    <div class="stat"><div class="k">财</div><div class="v" id="eCash">0</div></div>
    <div class="stat"><div class="k">名</div><div class="v" id="eFame">0</div></div>
    <div class="stat"><div class="k">缘</div><div class="v" id="eBond">0</div></div>
    <div class="stat"><div class="k">命</div><div class="v" id="eLife">0</div></div>
  </div>
  <div class="box">
    <div class="box-t">这一世的卦</div>
    <div class="log" id="endLog"></div>
  </div>
  <button class="btn" id="btnAgain">再投一世</button>
</section>

<script src="js/data-hexagrams.js"></script>
<script src="js/data-tarot.js"></script>
<script src="js/engine.js"></script>
<script>
(function(){
'use strict';
var E = window.Engine, HX = window.HEXAGRAM_BY_CODE, TAROT = window.TAROT;
var $ = function(s){ return document.querySelector(s); };
var SHENG = E.SHENG, KE = E.KE;

// 五行 → 行当
var CAREER = {
  '金': { name:'古玩', out:'cash', mult:1.0,  lifeNote:'' },
  '火': { name:'书院', out:'fame', mult:1.0,  lifeNote:'' },
  '木': { name:'攀亲', out:'bond', mult:1.0,  lifeNote:'' },
  '土': { name:'置产', out:'cash', mult:0.6,  lifeNote:'命 +2' },
  '水': { name:'摸金', out:'cash', mult:1.2,  lifeNote:'重注多 −1 命' }
};
var TRI = [
  { n:'乾', b:'111', el:'金', yang:true }, { n:'兑', b:'110', el:'金', yang:false },
  { n:'离', b:'101', el:'火', yang:false },{ n:'震', b:'100', el:'木', yang:true },
  { n:'巽', b:'011', el:'木', yang:false }, { n:'坎', b:'010', el:'水', yang:true },
  { n:'艮', b:'001', el:'土', yang:true },  { n:'坤', b:'000', el:'土', yang:false }
];
var BY_CODE = {}; TRI.forEach(function(t){ BY_CODE[t.b] = t; });
var MONTHS = ['木','火','土','金','水','土'];
var AGES = [17,24,31,38,47,56];
var NAMES = ['一','二','三','四','五','六'];

var S = null;
function newState(){
  S = {
    stage:0, life:12, cash:0, fame:0, bond:0,
    benming:null, zhigua:null, log:[],
    cur:null, picked:null, stake:null, busy:false
  };
}
newState();

// ---------- 掷钱 ----------
function tossCoins(){
  var c=[0,0,0].map(function(){ return Math.random()<.5 ? 2 : 3; });
  var sum = c.reduce(function(a,b){return a+b;},0);
  var t = { 6:{yang:false,moving:true}, 7:{yang:true,moving:false},
            8:{yang:false,moving:false}, 9:{yang:true,moving:true} }[sum];
  return { coins:c, sum:sum, yang:t.yang, moving:t.moving };
}
function tossTrigram(){
  var lines=[]; for(var i=0;i<3;i++) lines.push(tossCoins());
  var code = lines.map(function(l){ return l.yang?'1':'0'; }).join('');
  var moving = lines.some(function(l){ return l.moving; });
  var movingCount = lines.filter(function(l){ return l.moving; }).length;
  var changedCode = lines.map(function(l){
    if(!l.moving) return l.yang?'1':'0';
    return l.yang?'0':'1';
  }).join('');
  return { lines:lines, code:code, trigram:BY_CODE[code], changedCode:changedCode,
           changedTrigram:BY_CODE[changedCode], moving:movingCount };
}

// ---------- 长按 ----------
function bindHold(el, onDone){
  var timer=null, raf=null, t0=0, DUR=800;
  function tick(){
    var p = Math.min(1,(Date.now()-t0)/DUR);
    el.style.setProperty('--p', (p*100)+'%');
    if(p>=1){ finish(); return; }
    raf=requestAnimationFrame(tick);
  }
  function start(e){
    if(S.busy) return;
    e.preventDefault();
    S.busy=true; el.classList.add('press'); t0=Date.now(); tick();
  }
  function finish(){
    clearTimeout(timer); cancelAnimationFrame(raf);
    el.classList.remove('press'); el.style.setProperty('--p','0%');
    S.busy=false; onDone();
  }
  function cancel(){
    clearTimeout(timer); cancelAnimationFrame(raf);
    el.classList.remove('press'); el.style.setProperty('--p','0%');
    S.busy=false;
  }
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
}

function paintYao(el, lines){
  el.innerHTML = lines.map(function(l){
    return l.yang ? '<span></span>' : '<span class="yin"></span>';
  }).join('');
}

// ---------- 出生 ----------
var birthA=null, birthB=null, pickChoice=null;

bindHold($('#hold1'), function(){
  birthA = tossTrigram();
  paintYao($('#yao1'), birthA.lines);
  $('#box2').style.display='';
  $('#hold1').style.pointerEvents='none';
  $('#hold1').querySelector('span').textContent = '已定：' + birthA.trigram.n;
});

bindHold($('#hold2'), function(){
  birthB = tossTrigram();
  paintYao($('#yao2'), birthB.lines);
  $('#hold2').style.pointerEvents='none';
  $('#hold2').querySelector('span').textContent = '已定：' + birthB.trigram.n;
  showPick();
});

function showPick(){
  var opts = [birthA, birthB];
  $('#pickWrap').innerHTML = opts.map(function(o,i){
    var c = CAREER[o.trigram.el];
    return '<button data-i="'+i+'"><span class="g">'+o.trigram.n+'</span>'
      + '<span class="n">'+c.name+'</span>'
      + '<span class="e">'+o.trigram.el+' · 主 '+(c.out==='cash'?'财':c.out==='fame'?'名':'缘')+'</span></button>';
  }).join('');
  $('#pickWrap').querySelectorAll('button').forEach(function(btn){
    btn.onclick = function(){
      pickChoice = Number(btn.dataset.i);
      $('#pickWrap').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b===btn); });
      $('#btnStart').disabled = false;
    };
  });
  $('#boxPick').style.display='';
  $('#btnStart').style.display='';
}

$('#btnStart').onclick = function(){
  var chosen = pickChoice===0 ? birthA : birthB;
  var other  = pickChoice===0 ? birthB : birthA;
  S.benming = chosen.trigram;
  S.zhigua  = other.trigram;
  $('#bar').style.display='';
  startSection();
};

// ---------- 一节 ----------
function startSection(){
  if(S.life<=0){ endRun('命尽'); return; }
  if(S.stage>=6){ endRun('收摊'); return; }

  S.picked=null; S.stake=null; S.cur=null;
  $('#s-birth').classList.remove('on');
  $('#s-run').classList.add('on');
  $('#p-shake').style.display='';
  $('#p-hex').style.display='none';
  $('#p-ev').style.display='none';
  $('#p-pick').style.display='none';
  $('#p-reveal').style.display='none';
  $('#yao3').innerHTML='';
  var h=$('#hold3'); h.style.pointerEvents=''; h.querySelector('span').textContent='长按 0.8 秒';
  h.style.setProperty('--p','0%');

  $('#secLabel').textContent = '第'+NAMES[S.stage]+'节 · '+AGES[S.stage]+'岁 · 月令'+MONTHS[S.stage];
  paintBar();
  $('#shakeTitle').textContent='第'+NAMES[S.stage]+'节 · '+AGES[S.stage]+'岁 · 月令'+MONTHS[S.stage]+' · 长按摇上卦';
}

function paintBar(){
  var capped = Math.min(12, Math.max(0, S.life));
  var numEl = $('#lifeNum');
  if(numEl){ numEl.textContent = capped + '/12'; numEl.dataset.life = capped; }
  $('#life').innerHTML = Array.from({length:12},function(_,i){
    var on = i < capped;
    var cls = on ? (capped<=3?'on crit':'on') : '';
    return '<i class="'+cls+'"></i>';
  }).join('');
  $('#cash').textContent = Math.round(S.cash);
  $('#fame').textContent = Math.round(S.fame);
  $('#bond').textContent = Math.round(S.bond);
}

bindHold($('#hold3'), function(){
  var up = tossTrigram();
  paintYao($('#yao3'), up.lines);
  resolveSection(up);
});

// 旺衰
function wangShuai(cardEl, monthEl){
  if(cardEl===monthEl) return { lv:2, t:'旺', c:'t-w' };
  if(SHENG[monthEl]===cardEl) return { lv:1, t:'平', c:'t-p' };
  if(SHENG[cardEl]===monthEl) return { lv:1, t:'平', c:'t-p' };
  if(KE[monthEl]===cardEl)    return { lv:0, t:'死', c:'t-d' };
  return { lv:0, t:'死', c:'t-d' };
}

function resolveSection(up){
  var monthEl = MONTHS[S.stage];
  var lower = S.benming;            // 本命下卦
  var code = lower.b + up.code;     // 下卦 + 上卦
  var codeChanged = lower.b + up.changedCode;
  var hex = HX[code];
  var hexChanged = HX[codeChanged];

  var guaCard = up.trigram.yang ? 'a' : 'b';     // 阳卦指本命，阴卦指之卦
  var p = up.moving===0 ? .8 : (up.moving<=2 ? .55 : .3);

  // 另一条路：必须与本命不同行当，否则「断」没有意义
  var elA = lower.el;
  var elB = up.changedTrigram.el;          // 先取变卦上卦
  if (elB === elA) elB = up.trigram.el;    // 再取本卦上卦
  if (elB === elA) elB = SHENG[elA];       // 兜底：取我生者，必不同
  var wsA = wangShuai(elA, monthEl);
  var wsB = wangShuai(elB, monthEl);

  // 真相：月令定基率（权重 0.5 —— 让三片证据各有分量，月令不独大）
  var sA = wsA.lv * 0.5 + 1, sB = wsB.lv * 0.5 + 1;
  var pA = sA / (sA + sB);
  var truth = Math.random() < pA ? 'a' : 'b';

  // 牌：独立信号，正确率 .6
  var card = TAROT[Math.floor(Math.random()*TAROT.length)];
  var cardTruth = Math.random() < .6;
  var cardClaim = cardTruth ? truth : (truth==='a'?'b':'a');

  S.cur = {
    stage:S.stage, monthEl:monthEl, hex:hex, hexChanged:hexChanged, up:up,
    guaCard:guaCard, p:p, truth:truth,
    elA:elA, elB:elB, wsA:wsA, wsB:wsB,
    card:card, cardClaim:cardClaim
  };

  // 渲染卦名
  $('#hexGlyph').textContent = hex.glyph;
  $('#hexName').textContent = hex.sub;
  $('#hexJudge').textContent = '「'+hex.judgment+'」　'
    + (up.moving===0 ? '六爻皆静 · 此卦可信'
      : up.moving<=2 ? '两爻以内动 · 一半一半'
      : '动爻过半 · 卦说未必作数');

  // 渲染证据
  var cn = function(k){ return k==='a' ? CAREER[S.benming.el].name : CAREER[elB].name; };
  $('#evGua').innerHTML = '指 <b class="'+(guaCard==='a'?'t-a':'t-b')+'">'+cn(guaCard)+'</b>'
    + '<span class="tag '+(up.moving===0?'t-w':up.moving<=2?'t-p':'t-i')+'">'
    + (up.moving===0?'静·信它':up.moving<=2?'动·折半':'乱·反着看')+'</span>';

  $('#evMonth').innerHTML = '今年'+monthEl
    + '。'+CAREER[S.benming.el].name+'（'+elA+'）<b class="'+wsA.c+'">'+wsA.t+'</b>'
    + '　'+CAREER[elB].name+'（'+elB+'）<b class="'+wsB.c+'">'+wsB.t+'</b>';

  $('#evCard').innerHTML = '《'+card.name+'》'
    + '<span class="tag '+(cardClaim===guaCard?'t-w':'t-i')+'">'
    + (cardClaim===guaCard?'正位·助卦':'逆位·阻卦')+'</span>'
    + ' 指 <b class="'+(cardClaim==='a'?'t-a':'t-b')+'">'+cn(cardClaim)+'</b>';

  // 两张卡
  $('#cardsWrap').innerHTML = [
    { k:'a', el:elA, ws:wsA },
    { k:'b', el:elB, ws:wsB }
  ].map(function(x){
    var c = CAREER[x.el];
    var arrow = guaCard===x.k ? '　◀ 卦指' : '';
    return '<button class="card" data-k="'+x.k+'">'
      + '<span class="cn '+(x.k==='a'?'t-a':'t-b')+'">'+c.name+arrow+'</span>'
      + '<span class="ce">'+x.el+' · 主 '+(c.out==='cash'?'财':c.out==='fame'?'名':'缘')
      + (c.lifeNote?' · '+c.lifeNote:'')+'</span>'
      + '<span class="cs">今年<b class="'+x.ws.c+'">'+x.ws.t+'</b></span>'
      + '</button>';
  }).join('');

  $('#cardsWrap').querySelectorAll('.card').forEach(function(btn){
    btn.onclick = function(){
      S.picked = btn.dataset.k;
      $('#cardsWrap').querySelectorAll('.card').forEach(function(b){ b.classList.toggle('on', b===btn); });
      checkReady();
    };
  });

  $('#p-hex').style.display='';
  $('#p-ev').style.display='';
  $('#p-pick').style.display='';
  $('#p-shake').style.display='none';
  $('#p-reveal').style.display='none';
  $('#btnGo').disabled=true;
  $('#pickHint').textContent='先选一张，再选注码。';
  $('#pickHint').className='hint';
  paintBar();
}

$('#p-pick').querySelectorAll('[data-stake]').forEach(function(btn){
  btn.onclick = function(){
    S.stake = btn.dataset.stake;
    $('#p-pick').querySelectorAll('[data-stake]').forEach(function(b){ b.classList.toggle('on', b===btn); });
    checkReady();
  };
});

function checkReady(){
  if(!S.picked || !S.stake) return;
  var c = S.cur;
  var nm = function(k){ return k==='a'?CAREER[c.elA].name:CAREER[c.elB].name; };
  var lifeCost = S.stake==='light'?0:S.stake==='mid'?1:2;
  $('#pickHint').innerHTML = '你押 <b>'+nm(S.picked)+'</b>，'
    + (S.stake==='light'?'轻':S.stake==='mid'?'中':'重')+'注　→ 命 −'+lifeCost
    + '　（还剩 '+(S.life-lifeCost)+'）';
  $('#pickHint').className = (S.life-lifeCost<=0)?'hint warn':'hint';
  $('#btnGo').disabled=false;
}

$('#btnGo').onclick = function(){ settle(); };

function settle(){
  var c = S.cur;
  var stake = { light:{mult:.6,cost:0}, mid:{mult:1,cost:1}, heavy:{mult:1.8,cost:2} }[S.stake];
  var base = 40 + 10*c.stage;
  var win = (S.picked === c.truth);

  S.life -= stake.cost;
  var el = S.picked==='a' ? c.elA : c.elB;
  var career = CAREER[el];
  var money = 0;

  if(win){
    money = Math.round(base * stake.mult * career.mult);
    if(career.out==='cash') S.cash += money;
    else if(career.out==='fame') S.fame += money;
    else S.bond += money;
    if(el==='土') S.life += 2;
    if(el==='水' && S.stake==='heavy') S.life -= 1;
  } else {
    money = -Math.round(base * stake.mult * .35);
    S.life -= 1;                       // 押错另罚一格
  }

  S.log.push({
    stage:c.stage, hex:c.hex.sub, month:c.monthEl,
    picked:career.name, truth: c.truth==='a'?CAREER[c.elA].name:CAREER[c.elB].name,
    win:win, money:money, life:S.life
  });

  // 揭晓
  var truthName = c.truth==='a'?CAREER[c.elA].name:CAREER[c.elB].name;
  var truthEl = c.truth==='a'?c.elA:c.elB;
  var truthWs = c.truth==='a'?c.wsA:c.wsB;

  $('#rvWho').textContent = truthName + '（'+truthEl+'·'+truthWs.t+'）';
  $('#rvResult').innerHTML = win
    ? '<span class="ok">押中　'+(money>0?'+'+money:'0')+'</span>'
    : '<span class="no">押空　'+money+'　命另罚 −1</span>';

  var why = [];
  var nmA = CAREER[c.elA].name, nmB = CAREER[c.elB].name;
  var nameOf = function(k){ return k==='a'?nmA:nmB; };
  var monthWinner = c.wsA.lv === c.wsB.lv ? null : (c.wsA.lv > c.wsB.lv ? 'a' : 'b');

  why.push('月令'+c.monthEl+'：'+nmA+'「'+c.wsA.t+'」，'+nmB+'「'+c.wsB.t+'」。'
    + (monthWinner ? '按常理，'+nameOf(monthWinner)+'更该得势。' : '两张一样旺，月令不表态。'));

  why.push('卦指'+nameOf(c.guaCard)+'，这卦'
    + (c.up.moving===0 ? '六爻皆静——它多半说得对'
      : c.up.moving<=2 ? '动了两爻以内——半可信'
      : '动爻过半——它的话该反着听') + '。');

  why.push('牌指'+nameOf(c.cardClaim)+'。');

  var hits = [];
  if (monthWinner === c.truth) hits.push('月令');
  if (c.guaCard === c.truth) hits.push('卦');
  if (c.cardClaim === c.truth) hits.push('牌');
  why.push(hits.length
    ? '<b>这一次：'+hits.join('、')+' 说对了。</b>'
    : '<b>这一次三片全错——罕见，但不是没有。</b>');

  if (monthWinner && monthWinner !== c.truth) {
    why.push('月令看走了眼，这种事约两成会碰上一次。');
  }
  $('#rvWhy').innerHTML = why.join('<br>');

  $('#p-pick').style.display='none';
  $('#p-reveal').style.display='';
  paintBar();
  paintLog();

  if(S.life<=0){
    $('#btnNext').textContent='这一世到头了';
  } else if(S.stage>=5){
    $('#btnNext').textContent='收摊';
  } else {
    $('#btnNext').textContent='下一节';
  }
}

function paintLog(){
  $('#log').innerHTML = S.log.slice(-3).map(function(l){
    return '<div><b>'+AGES[l.stage]+'岁</b> '+l.hex+'（月令'+l.month+'）'
      + '　押<b>'+l.picked+'</b> 实为<b>'+l.truth+'</b>　'
      + (l.win?'<span class="ok">中</span>':'<span class="no">空</span>')
      + '　'+(l.money>0?'+':'')+l.money+'</div>';
  }).join('');
}

$('#btnNext').onclick = function(){
  S.stage += 1;
  if(S.life<=0){ endRun('命尽'); return; }
  if(S.stage>=6){ endRun('收摊'); return; }
  startSection();
};

// ---------- 结算 ----------
function endRun(reason){
  $('#s-run').classList.remove('on');
  $('#s-end').classList.add('on');
  PaintEnd();
}
function PaintEnd(){
  var c=S.cash, f=S.fame, b=S.bond, lf=S.life;
  var name, text;
  if(c>=180){ name='富家翁'; text='账上是实的，你就够了。'; }
  else if(f>=180){ name='一代宗师'; text='你的名字被写进了别人的注脚。'; }
  else if(b>=180){ name='儿孙满堂'; text='没什么钱，屋里一直有人说话。'; }
  else if(c>=90&&f>=90&&b>=90&&lf>=6){ name='半仙'; text='钱名缘都够，命也还在。'; }
  else if(lf<=2&&c<100){ name='落魄先生'; text='伤在身上，也落在账上。'; }
  else { name='无名之人'; text='这一世，也就这样过去了。'; }

  $('#endName').textContent = name;
  $('#endText').textContent = text;
  $('#eCash').textContent=Math.round(S.cash);
  $('#eFame').textContent=Math.round(S.fame);
  $('#eBond').textContent=Math.round(S.bond);
  $('#eLife').textContent=Math.max(0,S.life);
  $('#endLog').innerHTML = S.log.map(function(l){
    return '<div>'+AGES[l.stage]+'岁 '+l.hex+'　押'+l.picked+' 实为'+l.truth+'　'
      +(l.win?'<span class="ok">中</span>':'<span class="no">空</span>')+'</div>';
  }).join('') || '无';
}

$('#btnAgain').onclick = function(){
  newState();
  birthA=null;birthB=null;pickChoice=null;
  $('#s-end').classList.remove('on');
  $('#s-birth').classList.add('on');
  $('#bar').style.display='none';
  $('#box2').style.display='none';
  $('#boxPick').style.display='none';
  $('#btnStart').style.display='none';
  $('#btnStart').disabled=true;
  $('#yao1').innerHTML='';$('#yao2').innerHTML='';
  var h1=$('#hold1'); h1.style.pointerEvents=''; h1.querySelector('span').textContent='长按 0.8 秒摇卦';
  var h2=$('#hold2'); h2.style.pointerEvents=''; h2.querySelector('span').textContent='长按 0.8 秒摇卦';
};

})();
</script>
</body>
</html>
